name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt
      - run: python -m py_compile backend/app.py backend/embeddings.py backend/vector_db.py backend/retriever.py backend/llm_local.py
      - run: python -m py_compile backend/agents/doubt_agent.py backend/agents/quiz_agent.py backend/agents/summarizer_agent.py
